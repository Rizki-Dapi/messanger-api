$kind: http-request
name: Reset Password
method: POST
url: '{{base_url}}/auth/reset-password'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "token": "your-reset-token",
      "password": "NewPassword123!"
    }
