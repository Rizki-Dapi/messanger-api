$kind: http-request
name: Login
method: POST
url: '{{base_url}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "identity": "user@example.com",
      "password": "Password123!"
    }
