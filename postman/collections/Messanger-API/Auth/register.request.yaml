$kind: http-request
name: Register
method: POST
url: '{{base_url}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "identity": "user@example.com",
      "password": "Password123!"
    }
