$kind: http-request
name: Update Name
method: PUT
url: '{{base_url}}/user/update-name'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "name": "John Doe"
    }
