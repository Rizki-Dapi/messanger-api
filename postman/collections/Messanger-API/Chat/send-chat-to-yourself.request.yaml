$kind: http-request
name: Send Chat to Yourself
method: POST
url: '{{base_url}}/chat/send-chat-to-yourself'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "message": "Note to self"
    }
