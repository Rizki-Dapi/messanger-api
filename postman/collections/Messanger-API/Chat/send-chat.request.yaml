$kind: http-request
name: Send Chat
method: POST
url: '{{base_url}}/chat/send-chat/{{receiverId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
pathVariables:
  - key: receiverId
    value: '1'
body:
  type: json
  content: |-
    {
      "message": "Hello!"
    }
